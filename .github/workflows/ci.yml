name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's run in progress. Runs on main are never
# cancelled: each one triggers the Deploy for its own changes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
      e2e: ${{ steps.parts.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find changed parts
        id: parts
        run: .github/scripts/changed-parts.sh "$BASE_SHA" "$GITHUB_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  # Skipped jobs count as passing for required status checks, so docs-only
  # PRs can still be merged.
  backend:
    name: Backend build and test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

      # Coverage report (target/site/jacoco/index.html); the build fails if any
      # package is below coverage.minimum in pom.xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend build and test
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx ng test --watch=false

      - name: Production build
        run: npx ng build --base-href /SDEV-590-Project/

  # The main flows in real browsers (BILLIAMVT-47), against a stack that exists only in this
  # job: Postgres as a service container, the backend jar with its "local" profile, and the
  # Angular dev server. Never production. Playwright starts and stops both servers.
  e2e:
    name: End-to-end tests
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        # The same database, user and password as the local profile and docker-compose.yml
        env:
          POSTGRES_DB: housework
          POSTGRES_USER: housework
          POSTGRES_PASSWORD: housework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U housework -d housework"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      # The backend job already runs the tests
      - name: Build the backend jar
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests

      - name: Install front-end dependencies
        working-directory: frontend
        run: npm ci

      - name: Install end-to-end test dependencies
        working-directory: e2e
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}

      # --with-deps also installs the system libraries WebKit needs; cached browsers aren't downloaded again
      - name: Install browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test
        env:
          SPRING_PROFILES_ACTIVE: local
          E2E_BACKEND_COMMAND: java -jar target/housework-api-0.0.1-SNAPSHOT.jar

      # Open with "npx playwright show-report" (or show-trace for one test's trace.zip)
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
