<p class="welcome">Welcome, {{ auth.user()?.displayName }}.</p>

<p class="actions home-actions">
  <a class="button primary" routerLink="/tasks/new">Add a task</a>
  <a class="button" routerLink="/tasks">Your tasks</a>
</p>

<!-- Each reloads the other: putting an item on a day, or skipping or deleting one, moves it between them -->
<app-week-view #week (changed)="backlog.reload()" />

<app-backlog #backlog (placed)="week.reload()" />

<!-- Only for a new account: create or join a household. The household's details are in Settings. -->
<app-household-card place="home" (changed)="week.reload(); backlog.reload()" />
