spring.application.name=housework-api

# Render (and most PaaS hosts) inject the port to listen on via $PORT
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health

# Defaults point at the local Docker Compose database.
# On Render, SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD override these.
spring.datasource.url=jdbc:postgresql://localhost:5432/housework
spring.datasource.username=housework
spring.datasource.password=housework
# Small pool: Neon free tier and a 512 MB instance
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema; Hibernate only checks entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
