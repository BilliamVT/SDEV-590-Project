name: Smoke test

# After each successful deploy, checks in real browsers that production works: logs in with a
# dedicated account, sees its week and household, logs out (BILLIAMVT-48). Read-only, so it never
# changes production data. Can also be run by hand from the Actions tab.
#
# A failure here doesn't count as a failed deployment in the delivery metrics: a real break is
# fixed in a PR labelled "hotfix", which does (Change Log, 2026-11-18).
on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# A later deploy's smoke test replaces one still waiting
concurrency:
  group: smoke-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Playwright's own image: Node, Chromium, WebKit and their system libraries are preinstalled,
    # so there's no browser download or apt step to stall (two stalls on Nov 18). Keep the version
    # in step with @playwright/test in e2e/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install test dependencies
        working-directory: e2e
        run: npm ci

      - name: Run the smoke test
        working-directory: e2e
        run: npx playwright test -c smoke.config.ts
        env:
          SMOKE_TEST_EMAIL: ${{ secrets.SMOKE_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ secrets.SMOKE_TEST_PASSWORD }}

      # Open with "npx playwright show-report <folder>"; each failure has a screenshot and trace
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
