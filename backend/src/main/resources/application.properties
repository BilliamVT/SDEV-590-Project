spring.application.name=housework-api

# Render (and most PaaS hosts) inject the port to listen on via $PORT
server.port=${PORT:8080}

management.endpoints.web.exposure.include=health

# Datasource: none here on purpose. Production uses SPRING_DATASOURCE_* env vars (Render);
# local dev uses the "local" profile. If they're missing, startup fails instead of trying localhost.
# Small pool: Neon free tier and a 512 MB instance
spring.datasource.hikari.maximum-pool-size=5

# Flyway owns the schema; Hibernate only checks entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
