<h2>Account</h2>
@if (auth.user(); as user) {
  <dl>
    <dt>Name</dt>
    <dd>{{ user.displayName }}</dd>
    <dt>Email</dt>
    <dd>{{ user.email }}</dd>
  </dl>
}

<section class="danger">
  <h3>Delete account</h3>
  <p>Permanently delete your account. This can't be undone.</p>
  @if (confirming()) {
    <p class="warning">{{ consequence(household()) }}</p>
    <form [formGroup]="form" (ngSubmit)="delete()" novalidate>
      <label for="delete-password">Enter your password to confirm</label>
      <input id="delete-password" type="password" formControlName="password" autocomplete="current-password" />
      <p class="actions">
        <button type="submit" [disabled]="deleting()">{{ deleting() ? 'Deleting…' : 'Permanently delete my account' }}</button>
        <button type="button" (click)="cancel()" [disabled]="deleting()">Cancel</button>
      </p>
    </form>
  } @else {
    <button type="button" (click)="confirming.set(true)">Delete my account…</button>
  }
  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }
</section>
